openapi: 3.1.0
info:
  title: AlgaGuard Device Credential API
  version: 1.0.0
  description: >-
    Additive API for one-time device bootstrap, CSR-only certificate issuance,
    credential inspection, rotation, revocation, and broker authentication.
servers:
  - url: https://api.algaguard.example
    description: Portable placeholder; production hosting and CA providers remain undecided.
tags:
  - name: Credential administration
    description: Human operations authorized against current device ownership.
  - name: Device bootstrap
    description: Narrow, rate-limited bootstrap and rotation operations used by devices.
  - name: Internal broker authentication
    description: Service-authenticated validation used only by the trusted MQTT broker path.
paths:
  /api/v1/devices/{deviceUuid}/credential-bootstrap:
    parameters:
      - $ref: '#/components/parameters/DeviceUuid'
    post:
      operationId: createDeviceBootstrapAuthorization
      tags: [Credential administration]
      description: Create a short-lived one-use authorization for one already claimed, active device.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Bearer material is returned once; only its cryptographic hash is persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapAuthorization'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/device-credential-bootstrap/issue:
    post:
      operationId: submitInitialDeviceCredentialCsr
      tags: [Device bootstrap]
      description: >-
        Consume a one-use bootstrap authorization and sign a CSR whose public identity binds
        exactly to the scoped device; no private key is accepted or returned.
      security:
        - bootstrapBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrSubmission'
      responses:
        '201':
          description: Public client certificate, public CA chain, and bounded broker metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialIssuance'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceUuid}/credentials:
    parameters:
      - $ref: '#/components/parameters/DeviceUuid'
    get:
      operationId: listDeviceCredentials
      tags: [Credential administration]
      description: List immutable public credential metadata and retained lifecycle history.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credential metadata in newest-first order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/CredentialMetadata'
                required: [items]
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceUuid}/credential-rotations:
    parameters:
      - $ref: '#/components/parameters/DeviceUuid'
    post:
      operationId: initiateDeviceCredentialRotation
      tags: [Credential administration]
      description: Begin an idempotent, bounded two-certificate overlap for an eligible device.
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Rotation request for secure delivery to the currently authenticated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationRequest'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/device-credential-rotations/{rotationId}/issue:
    parameters:
      - $ref: '#/components/parameters/RotationId'
    post:
      operationId: submitRotatedDeviceCredentialCsr
      tags: [Device bootstrap]
      description: Submit an idempotent replacement CSR while authenticated by a valid current certificate.
      security:
        - deviceMutualTls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrSubmission'
      responses:
        '201':
          description: Replacement public certificate issued without revoking the working certificate yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialIssuance'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/device-credential-rotations/{rotationId}/acknowledgement:
    parameters:
      - $ref: '#/components/parameters/RotationId'
    post:
      operationId: acknowledgeDeviceCredentialRotation
      tags: [Device bootstrap]
      description: Idempotently activate a proven replacement credential and revoke its predecessor.
      security:
        - deviceMutualTls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationAcknowledgement'
      responses:
        '200':
          description: Persistent status after rotation completion or explicit failure recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialStatus'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceUuid}/credentials/{credentialId}/revocation:
    parameters:
      - $ref: '#/components/parameters/DeviceUuid'
      - $ref: '#/components/parameters/CredentialId'
    post:
      operationId: revokeDeviceCredential
      tags: [Credential administration]
      description: Revoke or mark compromised with current-ownership authorization and retained audit history.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  enum: [COMPROMISED, ADMIN_REVOKED, DEVICE_RETIRED, RECOVERY_REPLACED]
              required: [reason]
      responses:
        '200':
          description: Authoritative revocation state and documented enforcement interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationStatus'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /internal/v1/device-credentials/authenticate:
    post:
      operationId: authenticateMqttDeviceCredential
      tags: [Internal broker authentication]
      description: >-
        Validate the broker-verified public certificate fingerprint, SAN device UUID, CN device ID,
        credential state, device lifecycle, and exact identity binding before MQTT CONNECT succeeds.
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                clientId:
                  $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
                certificatePem:
                  type: string
                  minLength: 128
                  maxLength: 16384
              required: [clientId, certificatePem]
      responses:
        '200':
          description: EMQX-compatible allow or deny result with exact per-device ACLs on allow.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: string
                    enum: [allow, deny]
                  is_superuser:
                    const: false
                  expire_at:
                    type: integer
                    minimum: 1
                  acl:
                    type: array
                    maxItems: 11
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        permission:
                          type: string
                          enum: [allow, deny]
                        action:
                          type: string
                          enum: [publish, subscribe, all]
                        topic:
                          type: string
                          minLength: 1
                          maxLength: 256
                        qos:
                          type: array
                          maxItems: 1
                          items:
                            const: 1
                      required: [permission, action, topic]
                required: [result, is_superuser]
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
components:
  schemas:
    BootstrapAuthorization:
      type: object
      additionalProperties: false
      description: Conforms to urn:algaguard:schema:onboarding:bootstrap-authorization:v1.
      x-contract-schema: schemas/onboarding/bootstrap-authorization-v1.schema.json
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:bootstrap-authorization:v1
        schemaVersion:
          const: 1.0.0
        authorizationId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceUuid:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        bootstrapToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{43,128}$
        createdAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        expiresAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        attemptsRemaining:
          type: integer
          minimum: 1
          maximum: 20
        consumedAt:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
            - type: 'null'
      required:
        [
          schema,
          schemaVersion,
          authorizationId,
          deviceUuid,
          deviceId,
          bootstrapToken,
          createdAt,
          expiresAt,
          attemptsRemaining,
          consumedAt,
        ]
    CsrSubmission:
      type: object
      additionalProperties: false
      description: Conforms to urn:algaguard:schema:onboarding:credential-csr-submission:v1; private keys are forbidden.
      x-contract-schema: schemas/onboarding/credential-csr-submission-v1.schema.json
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:credential-csr-submission:v1
        schemaVersion:
          const: 1.0.0
        deviceUuid:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        purpose:
          type: string
          enum: [INITIAL, ROTATION, RECOVERY]
        rotationId:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/Uuid'
            - type: 'null'
        idempotencyKey:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        keyAlgorithm:
          type: string
          enum: [EC_P256, RSA_3072]
        csrPem:
          type: string
          minLength: 128
          maxLength: 16384
      required:
        [
          schema,
          schemaVersion,
          deviceUuid,
          deviceId,
          purpose,
          rotationId,
          idempotencyKey,
          keyAlgorithm,
          csrPem,
        ]
    CredentialMetadata:
      type: object
      additionalProperties: false
      description: Conforms to urn:algaguard:schema:onboarding:device-credential-metadata:v1.
      x-contract-schema: schemas/onboarding/device-credential-metadata-v1.schema.json
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:device-credential-metadata:v1
        schemaVersion:
          const: 1.0.0
        credentialId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceUuid:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        certificateSerial:
          type: string
          pattern: ^[0-9A-F]{2,80}$
        fingerprintSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        certificatePem:
          type: string
          minLength: 128
          maxLength: 16384
        issuerDistinguishedName:
          type: string
          maxLength: 1024
        subjectDistinguishedName:
          type: string
          maxLength: 1024
        sanUris:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
        notBefore:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        notAfter:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        issuedAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        activatedAt:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
            - type: 'null'
        revokedAt:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
            - type: 'null'
        revocationReason:
          oneOf:
            - type: string
              enum:
                [
                  ROTATED,
                  EXPIRED,
                  COMPROMISED,
                  ADMIN_REVOKED,
                  DEVICE_RETIRED,
                  ISSUANCE_ERROR,
                  RECOVERY_REPLACED,
                ]
            - type: 'null'
        status:
          type: string
          enum: [PENDING, ACTIVE, ROTATING, REVOKED, EXPIRED, COMPROMISED, FAILED]
        parentCredentialId:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/Uuid'
            - type: 'null'
        childCredentialId:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/Uuid'
            - type: 'null'
        createdAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        updatedAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
      required:
        [
          schema,
          schemaVersion,
          credentialId,
          deviceUuid,
          deviceId,
          certificateSerial,
          fingerprintSha256,
          certificatePem,
          issuerDistinguishedName,
          subjectDistinguishedName,
          sanUris,
          notBefore,
          notAfter,
          issuedAt,
          activatedAt,
          revokedAt,
          revocationReason,
          status,
          parentCredentialId,
          childCredentialId,
          createdAt,
          updatedAt,
        ]
    CredentialIssuance:
      type: object
      additionalProperties: false
      description: Conforms to urn:algaguard:schema:onboarding:credential-issuance:v1.
      x-contract-schema: schemas/onboarding/credential-issuance-v1.schema.json
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:credential-issuance:v1
        schemaVersion:
          const: 1.0.0
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        caChainPem:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            minLength: 128
            maxLength: 16384
        broker:
          type: object
          additionalProperties: false
          properties:
            host:
              type: string
              maxLength: 253
            port:
              type: integer
              minimum: 1
              maximum: 65535
            serverName:
              type: string
              maxLength: 253
            tlsRequired:
              const: true
            keepAliveSeconds:
              type: integer
              minimum: 15
              maximum: 3600
            sessionExpirySeconds:
              type: integer
              minimum: 0
              maximum: 604800
          required: [host, port, serverName, tlsRequired, keepAliveSeconds, sessionExpirySeconds]
      required: [schema, schemaVersion, credential, caChainPem, broker]
    RotationRequest:
      type: object
      additionalProperties: false
      description: Conforms to urn:algaguard:schema:onboarding:credential-rotation-request:v1.
      x-contract-schema: schemas/onboarding/credential-rotation-request-v1.schema.json
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:credential-rotation-request:v1
        schemaVersion:
          const: 1.0.0
        rotationId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceUuid:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        currentCredentialId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        requestedAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        expiresAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        overlapSeconds:
          type: integer
          minimum: 30
          maximum: 86400
        reason:
          type: string
          enum: [SCHEDULED, EXPIRING, ADMIN_REQUESTED, RECOVERY]
      required:
        [
          schema,
          schemaVersion,
          rotationId,
          deviceUuid,
          deviceId,
          currentCredentialId,
          requestedAt,
          expiresAt,
          overlapSeconds,
          reason,
        ]
    RotationAcknowledgement:
      type: object
      additionalProperties: false
      description: Conforms to urn:algaguard:schema:onboarding:credential-rotation-ack:v1.
      x-contract-schema: schemas/onboarding/credential-rotation-ack-v1.schema.json
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:credential-rotation-ack:v1
        schemaVersion:
          const: 1.0.0
        rotationId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceUuid:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        newCredentialId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        result:
          type: string
          enum: [CONNECTED, FAILED]
        connectedAt:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
            - type: 'null'
        acknowledgedAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        failureCode:
          oneOf:
            - type: string
              enum:
                [TLS_REJECTED, BROKER_UNREACHABLE, STORAGE_FAILURE, TIME_UNSYNCHRONIZED, UNKNOWN]
            - type: 'null'
      required:
        [
          schema,
          schemaVersion,
          rotationId,
          deviceUuid,
          deviceId,
          newCredentialId,
          result,
          connectedAt,
          acknowledgedAt,
          failureCode,
        ]
    CredentialStatus:
      type: object
      additionalProperties: false
      description: Conforms to urn:algaguard:schema:onboarding:credential-status:v1.
      x-contract-schema: schemas/onboarding/credential-status-v1.schema.json
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:credential-status:v1
        schemaVersion:
          const: 1.0.0
        deviceUuid:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        lifecycleStatus:
          type: string
          enum: [PENDING, ACTIVE, ROTATING, REVOKED, EXPIRED, COMPROMISED, FAILED]
        activeCredentialIds:
          type: array
          maxItems: 2
          items:
            $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        rotationId:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/Uuid'
            - type: 'null'
        rotationExpiresAt:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
            - type: 'null'
        recoveryRequired:
          type: boolean
        updatedAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
      required:
        [
          schema,
          schemaVersion,
          deviceUuid,
          deviceId,
          lifecycleStatus,
          activeCredentialIds,
          rotationId,
          rotationExpiresAt,
          recoveryRequired,
          updatedAt,
        ]
    RevocationStatus:
      type: object
      additionalProperties: false
      description: Conforms to urn:algaguard:schema:onboarding:credential-revocation-status:v1.
      x-contract-schema: schemas/onboarding/credential-revocation-status-v1.schema.json
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:credential-revocation-status:v1
        schemaVersion:
          const: 1.0.0
        credentialId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceUuid:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        status:
          type: string
          enum: [ACTIVE, ROTATING, REVOKED, EXPIRED, COMPROMISED, FAILED]
        revokedAt:
          oneOf:
            - $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
            - type: 'null'
        revocationReason:
          oneOf:
            - type: string
              enum:
                [
                  ROTATED,
                  EXPIRED,
                  COMPROMISED,
                  ADMIN_REVOKED,
                  DEVICE_RETIRED,
                  ISSUANCE_ERROR,
                  RECOVERY_REPLACED,
                ]
            - type: 'null'
        effectiveWithinSeconds:
          type: integer
          minimum: 0
          maximum: 300
        updatedAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
      required:
        [
          schema,
          schemaVersion,
          credentialId,
          deviceUuid,
          deviceId,
          status,
          revokedAt,
          revocationReason,
          effectiveWithinSeconds,
          updatedAt,
        ]
  parameters:
    DeviceUuid:
      name: deviceUuid
      in: path
      required: true
      description: Internal immutable UUID; the service resolves current ownership rather than trusting client input.
      schema:
        $ref: './common-components-v1.yaml#/components/schemas/Uuid'
    CredentialId:
      name: credentialId
      in: path
      required: true
      description: Immutable credential metadata UUID.
      schema:
        $ref: './common-components-v1.yaml#/components/schemas/Uuid'
    RotationId:
      name: rotationId
      in: path
      required: true
      description: Idempotent credential rotation UUID.
      schema:
        $ref: './common-components-v1.yaml#/components/schemas/Uuid'
  securitySchemes:
    bearerAuth:
      $ref: './common-components-v1.yaml#/components/securitySchemes/bearerAuth'
    bootstrapBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-one-time-token
      description: Short-lived single-use bearer material whose server-side representation is a cryptographic hash.
    deviceMutualTls:
      type: mutualTLS
      description: Current per-device client certificate; certificate validity alone does not authorize the operation.
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authenticated broker-to-service identity over the protected internal network.
