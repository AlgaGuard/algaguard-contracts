openapi: 3.1.0
info:
  title: AlgaGuard Device Service API
  version: 1.0.0
  description: Device registry, claiming, tank association, and latest health/status metadata. No firmware implementation is included.
servers:
  - url: https://api.algaguard.example
    description: Placeholder; the real portable API domain is TBD.
security:
  - bearerAuth: []
tags:
  - name: Devices
    description: Organization-authorized device operations.
paths:
  /api/v1/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      description: List devices visible to the authenticated organization member; requires device read permission.
      parameters:
        - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
        - $ref: './common-components-v1.yaml#/components/parameters/PageCursor'
        - $ref: './common-components-v1.yaml#/components/parameters/PageLimit'
      responses:
        '200':
          description: Paginated devices.
          headers:
            X-Correlation-ID:
              $ref: './common-components-v1.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  page:
                    $ref: './common-components-v1.yaml#/components/schemas/PageInfo'
                required: [items, page]
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
    get:
      tags: [Devices]
      operationId: getDevice
      description: Read one visible device; requires device read permission.
      responses:
        '200':
          description: Device registry record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceId}/claim:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
    post:
      tags: [Devices]
      operationId: claimDevice
      description: Claim an unowned device using a separately delivered one-time token; requires organization device-claim permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                claimToken:
                  type: string
                  minLength: 32
                  maxLength: 512
              required: [claimToken]
      responses:
        '200':
          description: Claimed device record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceUuid}/bootstrap-sessions/reissue:
    parameters:
      - name: deviceUuid
        in: path
        required: true
        description: Internal immutable UUID of an already-owned device.
        schema:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
      - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
    post:
      tags: [Devices]
      operationId: reissueOwnedDeviceBootstrapSession
      summary: Reissue one bootstrap session for an already-owned claimed device.
      description: Development/demo-only owner-authorized recovery operation. It neither creates nor claims a device and does not change ownership or ownershipVersion. A second request while a session is active is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnedDeviceBootstrapReissueRequest'
      responses:
        '201':
          description: A new short-lived bootstrap session returned exactly once.
          headers:
            Cache-Control:
              schema: { const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapSession'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/development/physical-session-handoffs/start:
    post:
      tags: [Devices]
      operationId: startDevelopmentPhysicalSessionHandoff
      summary: Start a development-only physical session handoff.
      description: Disabled by default and rejected in production or release environments. The device code is returned only to the local utility and must not be logged or placed in a URL.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalSessionHandoffStartRequest'
      responses:
        '201':
          description: One-time device code and short user code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSessionHandoffStartResponse'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/development/physical-session-handoffs/approve:
    post:
      tags: [Devices]
      operationId: approveDevelopmentPhysicalSessionHandoff
      summary: Authenticated approval of a development-only handoff.
      description: Validates the active session, device binding, organization authorization, and ownership version before storing an encrypted transient bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalSessionHandoffApproveRequest'
      responses:
        '204':
          description: Approval accepted without returning secret material.
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/development/physical-session-handoffs/redeem:
    post:
      tags: [Devices]
      operationId: redeemDevelopmentPhysicalSessionHandoff
      summary: Poll or redeem a development-only physical session handoff.
      description: The high-entropy device code can return the encrypted-session bundle exactly once after approval.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalSessionHandoffRedeemRequest'
      responses:
        '200':
          description: Pending state, terminal safe state, or a one-time redeemed bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalSessionHandoffRedeemResponse'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceId}/health:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
    get:
      tags: [Devices]
      operationId: getLatestDeviceHealth
      description: Read the latest validated device-health snapshot; requires device telemetry-read permission.
      responses:
        '200':
          description: Latest health payload and receive time.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  receivedAt:
                    $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
                  health:
                    type: object
                    description: Payload conforming to the MQTT device-health-v1 contract.
                required: [receivedAt, health]
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceId}/status:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
    get:
      tags: [Devices]
      operationId: getLatestDeviceStatus
      description: Read the latest validated retained lifecycle status; requires device read permission.
      responses:
        '200':
          description: Latest device status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ONLINE, OFFLINE, BOOTING, PROVISIONING, UPDATING, DEGRADED]
                  statusAt:
                    $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
                required: [status, statusAt]
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceId}/tank-association:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
    put:
      tags: [Devices]
      operationId: associateDeviceWithTank
      description: Associate a claimed device with one authorized tank; requires device administration permission and is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tankId:
                  $ref: './common-components-v1.yaml#/components/schemas/Uuid'
              required: [tankId]
      responses:
        '200':
          description: Updated device record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      $ref: './common-components-v1.yaml#/components/securitySchemes/bearerAuth'
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Bounded AlgaGuard device identifier.
      schema:
        $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
  schemas:
    OwnedDeviceBootstrapReissueRequest:
      description: Conforms to urn:algaguard:schema:onboarding:owned-device-bootstrap-reissue-request:v1.
      x-contract-schema: schemas/onboarding/owned-device-bootstrap-reissue-request-v1.schema.json
      type: object
      additionalProperties: false
      properties:
        schema:
          const: urn:algaguard:schema:onboarding:owned-device-bootstrap-reissue-request:v1
        schemaVersion: { const: 1.0.0 }
        ownershipVersion: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        expiresInSeconds: { type: integer, minimum: 60, maximum: 600 }
      required: [schema, schemaVersion, ownershipVersion, expiresInSeconds]
    BootstrapSession:
      description: Conforms to urn:algaguard:schema:onboarding:bootstrap-session:v1 and contains the sessionToken only in this one-time response.
      x-contract-schema: schemas/onboarding/bootstrap-session-v1.schema.json
      type: object
      additionalProperties: false
      properties:
        schema: { const: urn:algaguard:schema:onboarding:bootstrap-session:v1 }
        schemaVersion: { const: 1.0.0 }
        sessionId: { type: string, format: uuid }
        deviceId: { type: string, pattern: '^AG-[0-9]{6}$' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        serviceUuid:
          type: string
          format: uuid
          const: 0000a1a0-0000-1000-8000-00805f9b34fb
        sessionToken: { type: string, pattern: '^[A-Za-z0-9_-]{32,96}$' }
      required:
        [
          schema,
          schemaVersion,
          sessionId,
          deviceId,
          createdAt,
          expiresAt,
          serviceUuid,
          sessionToken,
        ]
    PhysicalSessionHandoffStartRequest:
      type: object
      additionalProperties: false
      properties:
        protocolVersion: { const: 1 }
        deviceId: { type: string, pattern: '^AG-[0-9]{6}$' }
      required: [protocolVersion, deviceId]
    PhysicalSessionHandoffStartResponse:
      type: object
      additionalProperties: false
      properties:
        handoffId: { type: string, format: uuid }
        deviceCode: { type: string, pattern: '^[A-Za-z0-9_-]{43,128}$' }
        userCode: { type: string, pattern: '^[A-HJ-NP-Z2-9]{6,16}$' }
        expiresAt: { type: string, format: date-time }
        pollIntervalSeconds: { type: integer, minimum: 1, maximum: 60 }
      required: [handoffId, deviceCode, userCode, expiresAt, pollIntervalSeconds]
    PhysicalSessionHandoffApproveRequest:
      type: object
      additionalProperties: false
      properties:
        protocolVersion: { const: 1 }
        userCode: { type: string, pattern: '^[A-HJ-NP-Z2-9 -]{6,20}$' }
        sessionId: { type: string, format: uuid }
        deviceId: { type: string, pattern: '^AG-[0-9]{6}$' }
        sessionToken: { type: string, pattern: '^[A-Za-z0-9_-]{32,96}$' }
      required: [protocolVersion, userCode, sessionId, deviceId, sessionToken]
    PhysicalSessionHandoffRedeemRequest:
      type: object
      additionalProperties: false
      properties:
        protocolVersion: { const: 1 }
        deviceCode: { type: string, pattern: '^[A-Za-z0-9_-]{43,128}$' }
      required: [protocolVersion, deviceCode]
    PhysicalSessionHandoffRedeemResponse:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            status: { enum: [PENDING, SLOW_DOWN] }
            pollIntervalSeconds: { type: integer, minimum: 1, maximum: 60 }
          required: [status, pollIntervalSeconds]
        - type: object
          additionalProperties: false
          properties:
            status: { enum: [EXPIRED, REJECTED] }
          required: [status]
        - type: object
          additionalProperties: false
          properties:
            status: { const: REDEEMED }
            sessionId: { type: string, format: uuid }
            deviceId: { type: string, pattern: '^AG-[0-9]{6}$' }
            sessionToken: { type: string, pattern: '^[A-Za-z0-9_-]{32,96}$' }
            expiresAt: { type: string, format: date-time }
          required: [status, sessionId, deviceId, sessionToken, expiresAt]
    Device:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        organizationId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        tankId:
          type:
            - string
            - 'null'
          format: uuid
        hardwareModel:
          type: string
          maxLength: 64
        firmwareVersion:
          type: string
          maxLength: 64
      required: [deviceId, organizationId, tankId, hardwareModel, firmwareVersion]
