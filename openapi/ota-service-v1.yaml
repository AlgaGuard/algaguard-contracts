openapi: 3.1.0
info:
  title: AlgaGuard OTA Service API
  version: 1.0.0
  description: Provider-neutral firmware release metadata, rollout campaigns, and device OTA status. Binary storage remains behind ObjectStorage.
servers:
  - url: https://api.algaguard.example
    description: Placeholder; the real portable API domain is TBD.
security:
  - bearerAuth: []
tags:
  - name: OTA
    description: Security-reviewed firmware release and rollout metadata.
paths:
  /api/v1/firmware/releases:
    get:
      tags: [OTA]
      operationId: listFirmwareReleases
      description: List firmware release metadata; requires firmware release read permission.
      parameters:
        - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
        - $ref: './common-components-v1.yaml#/components/parameters/PageCursor'
        - $ref: './common-components-v1.yaml#/components/parameters/PageLimit'
      responses:
        '200':
          description: Paginated firmware releases.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FirmwareRelease'
                  page:
                    $ref: './common-components-v1.yaml#/components/schemas/PageInfo'
                required: [items, page]
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
    post:
      tags: [OTA]
      operationId: createFirmwareRelease
      description: Register signed release metadata after security review; requires firmware release administration permission and never accepts private signing keys.
      parameters:
        - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirmwareRelease'
      responses:
        '201':
          description: Firmware release metadata created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareRelease'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/firmware/releases/{releaseId}:
    parameters:
      - $ref: '#/components/parameters/ReleaseId'
      - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
    get:
      tags: [OTA]
      operationId: getFirmwareRelease
      description: Read immutable signed firmware release metadata; requires firmware release read permission.
      responses:
        '200':
          description: Firmware release metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmwareRelease'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/ota/rollouts:
    post:
      tags: [OTA]
      operationId: createRolloutCampaign
      description: Create an authorized staged rollout campaign; requires OTA rollout permission, audit, and approved safety thresholds.
      parameters:
        - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                releaseId:
                  $ref: './common-components-v1.yaml#/components/schemas/Uuid'
                rolloutRing:
                  type: string
                  enum: [DEVELOPMENT, INTERNAL, BETA, PRODUCTION]
                deviceIds:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  uniqueItems: true
                  items:
                    $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
              required: [releaseId, rolloutRing, deviceIds]
      responses:
        '201':
          description: Rollout campaign created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  rolloutId:
                    $ref: './common-components-v1.yaml#/components/schemas/Uuid'
                  status:
                    type: string
                    enum: [PLANNED, ACTIVE, PAUSED, COMPLETED, CANCELLED]
                required: [rolloutId, status]
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
  /api/v1/devices/{deviceId}/ota/status:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: './common-components-v1.yaml#/components/parameters/CorrelationId'
    get:
      tags: [OTA]
      operationId: getDeviceOtaStatus
      description: Read the latest validated OTA status for a visible device; requires device OTA read permission.
      responses:
        '200':
          description: Latest device OTA status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOtaStatus'
        default:
          $ref: './common-components-v1.yaml#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      $ref: './common-components-v1.yaml#/components/securitySchemes/bearerAuth'
  parameters:
    ReleaseId:
      name: releaseId
      in: path
      required: true
      description: Firmware release UUID.
      schema:
        $ref: './common-components-v1.yaml#/components/schemas/Uuid'
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: AlgaGuard device ID.
      schema:
        $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
  schemas:
    CreateFirmwareRelease:
      type: object
      additionalProperties: false
      properties:
        releaseId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        version:
          type: string
          maxLength: 64
        hardwareModel:
          type: string
          maxLength: 64
        objectKey:
          type: string
          description: Provider-neutral ObjectStorage key, never an ARN.
          maxLength: 512
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        signature:
          type: string
          minLength: 40
          maxLength: 512
        signatureAlgorithm:
          type: string
          enum: [ED25519, ECDSA_P256_SHA256]
      required:
        [
          releaseId,
          version,
          hardwareModel,
          objectKey,
          sizeBytes,
          sha256,
          signature,
          signatureAlgorithm,
        ]
    FirmwareRelease:
      allOf:
        - $ref: '#/components/schemas/CreateFirmwareRelease'
        - type: object
          properties:
            publishedAt:
              $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
          required: [publishedAt]
    DeviceOtaStatus:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          $ref: './common-components-v1.yaml#/components/schemas/DeviceId'
        releaseId:
          $ref: './common-components-v1.yaml#/components/schemas/Uuid'
        status:
          type: string
          enum:
            [
              NOTIFIED,
              DOWNLOADING,
              DOWNLOADED,
              VERIFIED,
              INSTALLING,
              PENDING_BOOT_VALIDATION,
              SUCCEEDED,
              FAILED,
              ROLLED_BACK,
              REJECTED,
            ]
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        reportedAt:
          $ref: './common-components-v1.yaml#/components/schemas/UtcTimestamp'
        runningVersion:
          type: string
          maxLength: 64
      required: [deviceId, releaseId, status, progressPercent, reportedAt, runningVersion]
