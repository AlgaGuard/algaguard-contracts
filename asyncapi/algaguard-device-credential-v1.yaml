asyncapi: 3.1.0
info:
  title: AlgaGuard Device Credential Rotation MQTT API
  version: 1.0.0
  description: >-
    Additive messages carried on the existing device-scoped command and command-result topics.
    The broker requires a per-device X.509 certificate and exact ACLs.
servers:
  production:
    host: mqtt.algaguard.example
    protocol: mqtts
    description: Portable placeholder; production hosting and CA providers remain undecided.
    security:
      - $ref: '#/components/securitySchemes/deviceCertificate'
channels:
  rotationInstruction:
    address: algaguard/v1/devices/{deviceId}/commands
    description: Device receives a bounded, one-time credential rotation instruction.
    parameters:
      deviceId:
        $ref: '#/components/parameters/deviceId'
    messages:
      rotationRequest:
        $ref: '#/components/messages/rotationRequest'
  rotationAcknowledgement:
    address: algaguard/v1/devices/{deviceId}/command-results
    description: Device reports that the replacement certificate connected or failed.
    parameters:
      deviceId:
        $ref: '#/components/parameters/deviceId'
    messages:
      rotationAck:
        $ref: '#/components/messages/rotationAck'
operations:
  receiveRotationInstruction:
    action: receive
    summary: Receive certificate rotation request
    description: Device receives the request at QoS 1 without retained delivery.
    channel:
      $ref: '#/channels/rotationInstruction'
    messages:
      - $ref: '#/channels/rotationInstruction/messages/rotationRequest'
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0
  sendRotationAcknowledgement:
    action: send
    summary: Send certificate rotation result
    description: Device sends an idempotent acknowledgement at QoS 1 without retained delivery.
    channel:
      $ref: '#/channels/rotationAcknowledgement'
    messages:
      - $ref: '#/channels/rotationAcknowledgement/messages/rotationAck'
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0
components:
  securitySchemes:
    deviceCertificate:
      type: X509
      description: A unique CA-issued certificate whose CN is the canonical deviceId and SAN URI is the deviceUuid.
  parameters:
    deviceId:
      description: Canonical AlgaGuard device identifier derived from the verified certificate.
      location: $message.payload#/deviceId
  messages:
    rotationRequest:
      name: credentialRotationRequestV1
      title: Credential rotation request v1
      contentType: application/json
      payload:
        $ref: '../schemas/onboarding/credential-rotation-request-v1.schema.json'
      examples:
        - name: scheduledRotation
          summary: Bounded overlap request in examples/valid/credential-rotation-request-v1.json.
          payload:
            $ref: '../examples/valid/credential-rotation-request-v1.json'
    rotationAck:
      name: credentialRotationAckV1
      title: Credential rotation acknowledgement v1
      contentType: application/json
      payload:
        $ref: '../schemas/onboarding/credential-rotation-ack-v1.schema.json'
      examples:
        - name: replacementConnected
          summary: Successful replacement connection in examples/valid/credential-rotation-ack-v1.json.
          payload:
            $ref: '../examples/valid/credential-rotation-ack-v1.json'
